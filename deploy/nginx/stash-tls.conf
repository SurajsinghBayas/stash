# Production site, installed as /etc/nginx/sites-available/stash by deploy/remote-deploy.sh once the Let's Encrypt
# certificate exists (before that, setup-server.sh installs the plain-HTTP stash.conf for certbot's first run).
# DOMAIN and S3_ORIGIN are filled in from backend/.env. `nginx -t` runs before every reload; a bad config is
# rolled back automatically.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;  # the "http2 on" form needs nginx 1.25+; Ubuntu 24.04 ships 1.24
    listen [::]:443 ssl http2;
    server_name DOMAIN;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;  # TLS 1.2+, modern ciphers (maintained by certbot)
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/stash/frontend/dist;
    index index.html;
    client_max_body_size 12m;  # UPLOAD_MAX_BYTES is 10 MB (local storage path; S3 uploads go straight to S3)

    # Slow-client (slowloris) protection.
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;

    # Never serve dotfiles (.env, .git, …) if one ever lands in the web root. ACME challenges stay reachable.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location /api/v1/auth/ {
        limit_req zone=stash_auth burst=30 nodelay;
        limit_conn stash_conn 30;
        include /etc/nginx/snippets/stash-proxy.conf;
    }

    location /api/ {
        limit_req zone=stash_api burst=80 nodelay;
        limit_conn stash_conn 30;
        include /etc/nginx/snippets/stash-proxy.conf;
    }

    # Vite puts content-hashed files here, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/stash-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        include /etc/nginx/snippets/stash-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes fall back to index.html, which is never cached so a deploy is picked up at once.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/stash-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
