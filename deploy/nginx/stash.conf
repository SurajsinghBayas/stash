# One origin for the app: the built frontend from disk, /api proxied to uvicorn on 127.0.0.1:4000.
# setup-server.sh replaces DOMAIN; certbot then adds the 443 server block and the http -> https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /srv/stash/frontend/dist;
    index index.html;
    client_max_body_size 12m;  # UPLOAD_MAX_BYTES is 10 MB (local storage path; S3 uploads go straight to S3)

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;  # rate limits key on this
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;  # chat streams over SSE
        proxy_read_timeout 300s;
    }

    # Vite puts content-hashed files here, so they can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes fall back to index.html, which is never cached so a deploy is picked up at once.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
