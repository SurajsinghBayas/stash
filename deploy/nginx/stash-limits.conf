# http-level settings for Stash, installed as /etc/nginx/conf.d/stash-limits.conf by deploy/remote-deploy.sh.
# Rate limits per client IP. The app has its own, finer limits (per account, per action); these stop floods early.

limit_req_zone $binary_remote_addr zone=stash_api:10m rate=20r/s;   # whole API
limit_req_zone $binary_remote_addr zone=stash_auth:10m rate=30r/m;  # sign-in, sign-up, password reset
limit_conn_zone $binary_remote_addr zone=stash_conn:10m;            # open connections (chat streams included)
