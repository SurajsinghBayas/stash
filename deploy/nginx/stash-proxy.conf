# Proxy settings for the API (uvicorn on 127.0.0.1:4000), shared by the /api locations.
proxy_pass http://127.0.0.1:4000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;  # rate limits key on this; a client-sent X-Real-IP is overwritten
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_buffering off;  # chat streams over SSE
proxy_read_timeout 300s;
