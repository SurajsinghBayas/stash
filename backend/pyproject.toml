[project]
name = "stash-backend"
version = "0.1.0"
description = "Stash API and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt[crypto]>=2.8",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "openai>=1.40",
  "boto3>=1.35",
  "aiosmtplib>=3.0",
  "pillow>=10.4",
  "trafilatura>=2.3.1",
  "langgraph>=1.2.19",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["eval: runs against real AI providers (needs keys)"]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]
